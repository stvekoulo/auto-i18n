name: Framework compatibility

on:
  push:
    branches: [main]
    paths:
      [
        'src/**',
        'scripts/**',
        'tests/fixtures/**',
        'package.json',
        'package-lock.json',
        '.github/workflows/compatibility.yml',
      ]
  pull_request:
    paths:
      [
        'src/**',
        'scripts/**',
        'tests/fixtures/**',
        'package.json',
        'package-lock.json',
        '.github/workflows/compatibility.yml',
      ]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  applications:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      COMPAT_LATEST: ${{ github.event_name == 'schedule' && '1' || '0' }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:compat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.os }}
          path: .tmp/compatibility-report.json
          if-no-files-found: ignore
