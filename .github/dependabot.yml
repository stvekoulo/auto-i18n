version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tooling:
        dependency-type: development
  - package-ecosystem: npm
    directory: /tests/fixtures/next
    schedule:
      interval: weekly
    groups:
      next-compatibility:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /tests/fixtures/vite
    schedule:
      interval: weekly
    groups:
      vite-compatibility:
        patterns: ['*']
